<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2" style="color: #002F5D">
    <i class="bi bi-person-check-fill"></i>
    Inscribir Estudiantes
  </h5>
  <button type="button" class="btn-close" (click)="cancelar()" [disabled]="bloqueado"></button>
</div>

<div class="modal-body">
  <!-- VISTA 1: TARJETAS POR AÑO -->
  <div *ngIf="vista === 'tarjetas'">
    <div class="row row-cols-2 row-cols-md-4 g-3">
      <div class="col" *ngFor="let item of aniosConConteo">
        <div class="card text-white text-center shadow-sm border-0 py-4"
             style="background-color: #002F5D; cursor: pointer; border-radius: 12px;"
             (click)="seleccionarAnio(item.anio)">
          <div class="fw-bold" style="font-size: 2rem;">{{ item.anio }}</div>
          <div style="font-size: 0.85rem; font-weight: 300; opacity: 0.85;">{{ item.cantidad }} Alumnos</div>
        </div>
      </div>
    </div>

    <div *ngIf="aniosConConteo.length === 0" class="alert alert-info text-center mt-3">
      No hay estudiantes disponibles para inscribir en esta asignatura.
    </div>
  </div>

  <!-- VISTA 2: DETALLE DEL AÑO SELECCIONADO -->
  <div *ngIf="vista === 'detalle'">
    <button class="btn btn-link mb-2 ps-0" (click)="volverATarjetas()">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </button>

    <div class="mb-3">
      <label class="form-label fw-semibold" for="anioCursada">
        Año de cursada
        <i class="bi bi-info-circle text-muted ms-1" 
           [title]="'Año en que el estudiante cursa esta asignatura. Puede diferir de su año de ingreso si repite o se atrasa.'"></i>
      </label>
      <input type="number" class="form-control" id="anioCursada" [(ngModel)]="anioCursada" (ngModelChange)="onAnioCursadaChange()" [min]="anioMinimoValido" [max]="anioMaximoValido" />
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Buscar estudiante por nombre o RUT..." [(ngModel)]="filtro" />
    </div>

    <div class="card shadow-sm border-0" style="max-height: 400px; overflow-y: auto;">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>
                <div class="form-check d-flex align-items-center gap-1 mb-0">
                  <input type="checkbox" class="form-check-input" [checked]="todosSeleccionados" (change)="toggleTodos($event)" />
                  <label class="form-check-label small">Todos</label>
                </div>
              </th>
              <th>RUT</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Año Ingreso</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let est of estudiantesFiltrados()">
              <td>
                <input type="checkbox" [(ngModel)]="est.seleccionado" />
              </td>
              <td>{{ est.ID_Estudiante | rutFormat }}</td>
              <td>{{ est.Nombre }}</td>
              <td>{{ est.Apellido }}</td>
              <td>{{ est.Anio_Ingreso }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="modal-footer">
  <button class="btn btn-primary" (click)="confirmarInscripcion()" [disabled]="bloqueado || !haySeleccionados()">
    <i class="bi bi-person-check-fill me-1"></i> Guardar
  </button>
  <button class="btn btn-secondary" (click)="cancelar()" [disabled]="bloqueado">Cancelar</button>
</div>

<!-- Toast éxito -->
<div
  *ngIf="mensajeExito && bloqueado"
  class="toast-container position-fixed bottom-0 end-0 p-3"
  style="z-index: 2000"
>
  <div class="toast show text-bg-success" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi bi-check-circle-fill me-2"></i>{{ mensajeExito }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="cerrarToast()"></button>
    </div>
  </div>
</div>
