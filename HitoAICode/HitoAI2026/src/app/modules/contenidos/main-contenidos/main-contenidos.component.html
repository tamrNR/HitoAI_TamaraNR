<div class="main-layout">
  <app-sidebar [rol]="rolUsuario"></app-sidebar>

  <div class="main-content p-4" style="background-color: #f4f6fa; min-height: 100vh; margin-left: 70px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold" style="color: #002F5D;">
        <i class="bi bi-journal-bookmark-fill me-2"></i>Contenidos Curriculares
      </h3>
    </div>

    <!-- Filtros -->
    <div class="card mb-4 shadow-sm border-0">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label small fw-bold">Facultad</label>
            <select class="form-select" [(ngModel)]="filtroFacultad" (change)="filtroCarrera=''; aplicarFiltros()">
              <option value="">Todas las facultades</option>
              <option *ngFor="let f of facultades" [value]="f">{{ f }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">Carrera</label>
            <select class="form-select" [(ngModel)]="filtroCarrera" (change)="aplicarFiltros()">
              <option value="">Todas las carreras</option>
              <option *ngFor="let c of carreras" [value]="c">{{ c }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-bold">Buscar asignatura</label>
            <input type="text" class="form-control" placeholder="Nombre o ID..."
                   [(ngModel)]="filtroTexto" (input)="aplicarFiltros()" />
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-outline-secondary w-100" (click)="limpiarFiltros()">
              <i class="bi bi-x-circle me-1"></i> Limpiar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla de asignaturas -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Carrera</th>
              <th>Semestre</th>
              <th>Plan</th>
              <th class="text-end">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="asignaturasFiltradas.length === 0">
              <td colspan="6" class="text-center text-muted py-4">
                No se encontraron asignaturas con esos filtros.
              </td>
            </tr>
            <tr *ngFor="let a of asignaturasFiltradas" style="cursor:pointer;"
                (click)="verDetalle(a)">
              <td><span class="badge bg-secondary">{{ a.ID_Asignatura }}</span></td>
              <td>{{ a.Nombre }}</td>
              <td>{{ a.Carrera }}</td>
              <td>{{ a.Semestre }}</td>
              <td>{{ a.Plan_Academico }}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary" (click)="verDetalle(a); $event.stopPropagation()">
                  <i class="bi bi-eye me-1"></i> Ver detalle
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
