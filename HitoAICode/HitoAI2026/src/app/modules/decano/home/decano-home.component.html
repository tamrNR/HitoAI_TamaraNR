<div class="main-layout">
  <app-sidebar [rol]="'Decano'"></app-sidebar>

  <div class="main-content p-4" style="margin-left: 70px;">
    <h2 class="mb-1">Panel Decano</h2>
    <p class="text-muted">Análisis de solo lectura sobre las carreras de tu facultad.</p>

    <!-- Filtros en cascada -->
    <div class="card filtros-card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Carrera</label>
            <select class="form-select" [(ngModel)]="carreraId" (ngModelChange)="cargarPlanes()">
              <option [ngValue]="null">Selecciona…</option>
              <option *ngFor="let c of carreras" [ngValue]="c.id">{{ c.nombre }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Plan</label>
            <select class="form-select" [(ngModel)]="planId" (ngModelChange)="cargarAsignaturas()" [disabled]="!carreraId">
              <option [ngValue]="null">Selecciona…</option>
              <option *ngFor="let p of planes" [ngValue]="p.id">{{ p.nombre }}</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Cohorte</label>
            <select class="form-select" [(ngModel)]="cohorteId">
              <option [ngValue]="null">Selecciona…</option>
              <option *ngFor="let c of cohortes" [ngValue]="c.id">{{ c.nombre }}</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Semestre</label>
            <select class="form-select" [(ngModel)]="semestreId" (ngModelChange)="cargarAsignaturas()">
              <option [ngValue]="null">Selecciona…</option>
              <option *ngFor="let s of semestres" [ngValue]="s.id">{{ s.nombre }}</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Asignatura</label>
            <select class="form-select" [(ngModel)]="asignaturaId" [disabled]="asignaturas.length === 0">
              <option [ngValue]="null">Selecciona…</option>
              <option *ngFor="let a of asignaturas" [ngValue]="a.id">{{ a.nombre }}</option>
            </select>
          </div>
        </div>
        <div class="mt-3 d-flex justify-content-end">
          <button class="btn btn-primary" (click)="generarAnalisis()" [disabled]="cargando || !filtrosCompletos()">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
            Generar análisis
          </button>
        </div>
        <div *ngIf="errorMsg" class="alert alert-warning mt-3 mb-0">{{ errorMsg }}</div>
      </div>
    </div>

    <!-- Radar -->
    <div class="card mb-4" *ngIf="radarData">
      <div class="card-header"><strong>Radar de competencias (promedio del curso)</strong></div>
      <div class="card-body">
        <div style="max-width: 480px; margin: 0 auto;">
          <canvas baseChart [data]="radarData" [options]="radarOptions" type="radar"></canvas>
        </div>
      </div>
    </div>

    <!-- Barras comparativas -->
    <div class="card mb-4" *ngIf="barrasData">
      <div class="card-header"><strong>Barras comparativas por competencia</strong></div>
      <div class="card-body">
        <canvas baseChart [data]="barrasData" [options]="barrasOptions" type="bar"></canvas>
      </div>
    </div>

    <!-- Tabla comparativa por cohorte -->
    <div class="card mb-4" *ngIf="tablaFilas.length">
      <div class="card-header"><strong>Tabla comparativa por cohorte</strong></div>
      <div class="card-body table-responsive">
        <table class="table table-sm table-bordered align-middle">
          <thead>
            <tr>
              <th>Alumno / Asignatura</th>
              <th *ngFor="let comp of tablaCompetencias">{{ comp }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let fila of tablaFilas" [class.fila-asignatura]="fila.tipo === 'asignatura'">
              <td>{{ fila.label }}</td>
              <td *ngFor="let comp of tablaCompetencias" [ngClass]="claseCelda(fila, comp)">
                {{ valorCelda(fila, comp) }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
